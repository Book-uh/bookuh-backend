spring:
  application:
    name: bookuh-backend
  datasource:
    url: jdbc:mysql://localhost:3306/bookuh_db?serverTimezone=UTC&characterEncoding=UTF-8
    username: bookuh
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: 8081

google:
  books:
    api-key: ${GOOGLE_BOOKS_API_KEY}

auth:
  token-secret: ${AUTH_TOKEN_SECRET}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-5-5
